    title: P vs NP
    display_summary: Compare proof barriers and plausible future strategies for P versus NP.
    prompt: >-
      Among the major known barriers to resolving P versus NP, which ones most
      strongly constrain plausible future proof strategies? Compare at least
      two approaches and distinguish established barriers from speculative
      judgments about promising directions.
    sources:
      - source_kind: literature_anchored
        source_name: Clay Mathematics Institute — P vs NP
        source_url: https://www.claymath.org/millennium/p-vs-np/
        source_role: background_anchor

