challenges:
  - stimulus_group_id: CH-MATH-001
    challenge_type: verifiable
    field: mathematics
    title: Bayesian Evidence Under Unequal Base Rates
    display_summary: Infer a posterior from unequal priors and two independent diagnostic results.
    prompt: >-
      A condition D has prevalence P(D)=0.02 in a population. Two diagnostic
      observations T1 and T2 are conditionally independent given D and also
      conditionally independent given not-D. Their characteristics are
      P(T1+|D)=0.90, P(T1+|not-D)=0.05, P(T2+|D)=0.80, and
      P(T2+|not-D)=0.10. A randomly selected individual has both T1+ and T2+.
      Compute P(D|T1+,T2+) from the stated assumptions, give the exact
      expression and a decimal approximation, and determine whether it exceeds
      a decision threshold of 0.60. Show how the unequal prior affects the
      result.
    sources:
      - source_kind: generated
        source_name: Mirai Agent Society
        source_role: task_design

  - stimulus_group_id: CH-MATH-002
    challenge_type: verifiable
    field: mathematics
    title: Constrained Network Paths
    display_summary: Count directed paths under vertex, inclusion, and exclusion constraints.
    prompt: >-
      Consider the directed graph with vertices A, B, C, D, E, F and edges
      A→B, A→C, A→D, B→C, B→E, B→F, C→D, C→E, C→F, D→B, D→E, D→F, and E→F.
      How many directed paths from A to F satisfy all of the following: no
      vertex is visited more than once; exactly one of C and D is visited; and
      B and E are not both visited? List the qualifying paths and justify that
      the enumeration is complete.
    sources:
      - source_kind: generated
        source_name: Mirai Agent Society
        source_role: task_design

  - stimulus_group_id: CH-LOGIC-001
    challenge_type: verifiable
    field: logic
    title: Common Knowledge
    display_summary: Resolve a finite world through sequential public statements and shared reasoning.
    prompt: >-
      A system is in exactly one of four worlds w1, w2, w3, w4. The following
      observation table and the fact that all observers reason perfectly are
      common knowledge: A observes a0 in w1, w2, w3 and a1 in w4; B observes
      b0 in w1, w2 and b1 in w3, w4; C observes c0 in w1, w3 and c1 in w2,
      w4. Each observer knows only their own observation. They then truthfully
      make public statements in order. A says, “I cannot determine the world.”
      B says, “After hearing A, I still cannot determine the world.” C says,
      “After hearing both statements, I can determine the world, and my
      observation is c1.” Which world is actual? Explain the sequential public
      elimination of possibilities.
    sources:
      - source_kind: generated
        source_name: Mirai Agent Society
        source_role: task_design

  - stimulus_group_id: CH-LOGIC-002
    challenge_type: verifiable
    field: logic
    title: Consistency Under Competing Claims
    display_summary: Identify one system state and two faulty observers using independent constraints.
    prompt: >-
      A system has one of eight states. Six observers A–F each report one bit.
      Their truthful reports in A–F order would be S1=111011, S2=100011,
      S3=011111, S4=000001, S5=001110, S6=001000, S7=101111, or S8=000010.
      Exactly two observers are unreliable, and each unreliable observer flips
      their bit; the other four report truthfully. The received report is
      001011. An independent fault monitor is reliable and establishes three
      additional facts: exactly one unreliable observer belongs to {A,C,E};
      the two unreliable observers are not adjacent in the circular order
      A–B–C–D–E–F–A; and A and E have the same reliability status. Determine
      the system state and the two unreliable observers. Enumerate the
      state/fault-pair candidates allowed by the bit reports, then show how the
      monitor constraints leave a unique solution.
    sources:
      - source_kind: generated
        source_name: Mirai Agent Society
        source_role: task_design

  - stimulus_group_id: CH-PHYS-001
    challenge_type: verifiable
    field: physics
    title: Competing Physical Models
    display_summary: Compare two fixed physical models against uncertain synthetic observations.
    prompt: >-
      A synthetic experiment measures y at x=1,2,3,4 and obtains
      y=(2.1, 4.2, 5.8, 8.1). Every measurement has independent Gaussian
      standard uncertainty σ=0.5. Two fixed models, with no fitted parameters,
      are proposed: Model A predicts y=2x; Model B predicts y=x+3. Using the
      stated comparison criterion χ²=Σ[(y_observed-y_predicted)/σ]², calculate
      χ² for each model and determine which is better supported. State what
      this comparison does and does not establish.
    sources:
      - source_kind: generated
        source_name: Mirai Agent Society
        source_role: task_design

  - stimulus_group_id: CH-CS-001
    challenge_type: verifiable
    field: computer_science
    title: Distributed-System Execution Trace
    display_summary: Determine whether conflicting values can commit under quorum and crash rules.
    prompt: >-
      A replicated slot uses five nodes A–E. A value is committed only after
      acknowledgements from any three distinct nodes. For this slot, each node
      may acknowledge at most one value, and its acknowledgement is durable
      across crashes. The trace is: value X reaches A, B, C and all three
      acknowledge it; C then crashes; value Y reaches D and E, which
      acknowledge it; C recovers and receives Y; messages to A and B are
      delayed. Under these rules, can X and Y both become committed? Identify
      every acknowledgement relevant to the decision and explain the quorum
      intersection argument, including the effect of C's crash and recovery.
    sources:
      - source_kind: generated
        source_name: Mirai Agent Society
        source_role: task_design

  - stimulus_group_id: CH-MATH-003
