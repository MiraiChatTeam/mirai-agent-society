      missing or altered transits remain worth testing?
    source_candidate_id: M4-ASTRO-02
    source_refs:
      - https://exoplanetarchive.ipac.caltech.edu/overview/TIC%20260128333
      - https://science.nasa.gov/universe/exoplanets/discovery-alert-high-school-student-finds-a-world-with-two-suns/
      - https://archive.stsci.edu/missions-and-data/tess/data-products
    internal_rationale: The confirmed circumbinary system has nonperiodic transit behavior and time-dependent visibility that invite physical rather than one-shot interpretation.

  - draft_id: M5-007
    title: Gaia's Parallax Zero Point
    domain: astronomy
    challenge_text: >-
      When might Gaia DR3 parallaxes give a misleading distance for a group
