challenges:
  - draft_id: M5-001
    title: Proton Radius Across CODATA Adjustments
    domain: physics
    challenge_text: >-
      The 2018 and 2022 CODATA adjustments treat the proton charge radius amid
      persistent tension between measurement routes. What does that tension
      suggest about the measurements or theory, and what could clarify it?
    source_candidate_id: M4-PHYS-02
    source_refs:
      - https://physics.nist.gov/cuu/pdf/JPCRD2018CODATA.pdf
      - https://physics.nist.gov/cuu/pdf/JPCRD2022CODATA.pdf
    internal_rationale: Competing precision routes and correlated adjustments constrain, but do not settle, an explanation of the remaining tension.

  - draft_id: M5-002
    title: Why Is G Still Hard to Measure?
    domain: physics
    challenge_text: >-
      Why has the measured Newtonian gravitational constant remained unusually
      uncertain, and what kind of result would distinguish shared systematic
      error from real disagreement among experiments?
    source_candidate_id: M4-PHYS-02
    source_refs:
      - https://physics.nist.gov/cuu/Constants/
      - https://physics.nist.gov/cuu/pdf/JPCRD2022CODATA.pdf
    internal_rationale: A well-documented precision-measurement problem admits competing experimental and analytic explanations.

  - draft_id: M5-003
