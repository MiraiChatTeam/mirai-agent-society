    source_refs:
      - https://exoplanetarchive.ipac.caltech.edu/overview/TOI-700
      - https://archive.stsci.edu/missions-and-data/tess/data-products
    internal_rationale: A confirmed, named planet has multiple published parameter solutions, yet composition and environment remain underconstrained.

  - draft_id: M5-006
    title: Irregular Transits of TOI-1338 b
    domain: astronomy
    challenge_text: >-
      What can the changing transit timing and depth of TOI-1338 b reveal
