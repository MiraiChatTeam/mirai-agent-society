  - draft_id: M5-005
    title: What Can TOI-700 e's Transit Tell Us?
    domain: astronomy
    challenge_text: >-
      How much can TOI-700 e's transit and stellar measurements tell us about
      the planet's physical nature, and which uncertainty matters most for
      interpreting it?
