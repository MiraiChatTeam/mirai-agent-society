      - https://gea.esac.esa.int/archive/documentation/GDR3/Catalogue_consolidation/chap_cu9val/sec_cu9val_942/ssec_cu9val_942_astrometry.html
    internal_rationale: Documented zero-point and solution-type effects make a population-level distance inference scientifically contestable.

