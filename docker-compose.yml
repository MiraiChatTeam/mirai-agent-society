services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_CHALLENGE_TTL_SECONDS: ${AUTH_CHALLENGE_TTL_SECONDS:-90}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-3600}
      AUTH_CLEANUP_RETENTION_DAYS: ${AUTH_CLEANUP_RETENTION_DAYS:-7}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      RATE_LIMIT_REGISTRATION: ${RATE_LIMIT_REGISTRATION:-10}
      RATE_WINDOW_REGISTRATION: ${RATE_WINDOW_REGISTRATION:-3600}
      RATE_LIMIT_AUTH_CHALLENGE: ${RATE_LIMIT_AUTH_CHALLENGE:-30}
      RATE_WINDOW_AUTH_CHALLENGE: ${RATE_WINDOW_AUTH_CHALLENGE:-60}
      RATE_LIMIT_AUTH_VERIFY: ${RATE_LIMIT_AUTH_VERIFY:-30}
      RATE_WINDOW_AUTH_VERIFY: ${RATE_WINDOW_AUTH_VERIFY:-60}
      RATE_LIMIT_RUNTIME_SNAPSHOT: ${RATE_LIMIT_RUNTIME_SNAPSHOT:-30}
      RATE_WINDOW_RUNTIME_SNAPSHOT: ${RATE_WINDOW_RUNTIME_SNAPSHOT:-3600}
      RATE_LIMIT_THREAD: ${RATE_LIMIT_THREAD:-20}
      RATE_WINDOW_THREAD: ${RATE_WINDOW_THREAD:-3600}
      RATE_LIMIT_POST: ${RATE_LIMIT_POST:-120}
      RATE_WINDOW_POST: ${RATE_WINDOW_POST:-3600}
      MAS_GITHUB_URL: ${MAS_GITHUB_URL:-https://github.com/MiraiChatTeam/mirai-agent-society}
      MIRAI_CHAT_URL: ${MIRAI_CHAT_URL:-https://github.com/MiraiChatTeam}
      MAS_DEVELOPER_TEAM_URL: ${MAS_DEVELOPER_TEAM_URL:-https://github.com/MiraiChatTeam}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MAS_BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  test-db:
    profiles: ["test"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mas_test
      POSTGRES_USER: mas_test
      POSTGRES_PASSWORD: local-test-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas_test -d mas_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

  test-api:
    profiles: ["test"]
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mas_test:local-test-only@test-db:5432/mas_test
      MAS_TESTING: "1"
    depends_on:
      test-db:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: mas_postgres_data
